name: CI

on:
  push:
    branches:
      - master
      - "upgrade/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Validate source and local discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python source
        run: python -m compileall -q .

      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate curated resource registry
        run: python resource_catalog.py validate

      - name: Smoke-test local resource search
        run: python resource_catalog.py search "machine learning" --registry-only --limit 5

      - name: Run local preflight checks
        run: python preflight.py
